services:
  nginx:
    image: nginx:alpine
    container_name: app_nginx
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/storage:/var/www/html/storage
    depends_on:
      php:
        condition: service_healthy
    networks:
      - app_net
    links:
      - php:php
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: app_php
    expose:
      - "9000"
    environment:
      - APP_ENV=${APP_ENV:-local}
    volumes:
      - ./src:/var/www/html
    networks:
      app_net:
        aliases:
          - php
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "php", "/var/www/html/artisan", "about"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: app_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: starscy_db
      POSTGRES_USER: starscy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starscy -d starscy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
